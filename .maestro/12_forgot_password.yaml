appId: ${APP_ID}
name: "Auth - Mot de passe oublie"
---

# Flow: Forgot Password
# Teste le parcours de recuperation de mot de passe

- launchApp:
    clearState: true

# Verifier ecran de connexion
- assertVisible:
    text: "Connexion"

# Naviguer vers mot de passe oublie
- tapOn:
    text: "Mot de passe oubli.*"
    optional: true

- assertVisible:
    text: ".*mot de passe.*"
    optional: true

# Saisir l'email
- tapOn:
    text: ".*email.*"
    optional: true
- inputText: ${TEST_EMAIL}

# Soumettre la demande
- tapOn:
    text: ".*envoyer.*|.*reinitialiser.*|.*recuperer.*"
    optional: true

# Verifier le message de confirmation
- extendedWaitUntil:
    visible:
      text: ".*email.*envoy.*|.*lien.*envoy.*|.*verifi.*boite.*"
    timeout: 10000
    optional: true

# Retour a l'ecran de connexion
- tapOn:
    text: ".*retour.*connexion.*|.*se connecter.*"
    optional: true

- assertVisible:
    text: "Connexion"
    optional: true
