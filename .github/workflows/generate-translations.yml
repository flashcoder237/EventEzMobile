name: Générer les traductions (i18n)

# Génère les {lang}.json via Argos Translate DANS LE CLOUD (les modèles ~100 Mo
# par langue se téléchargent sur les serveurs GitHub, pas sur ta connexion) puis
# les pousse dans le repo public `eventez-i18n` servi par GitHub Pages.
#
# DÉCLENCHEMENT :
#   - AUTOMATIQUE : à chaque push sur `master` qui modifie en.json (les textes
#     d'interface ont changé → il faut (re)traduire). Tourne en --all --only-missing
#     → toutes les langues, en ne traduisant QUE les clés manquantes (les
#     traductions existantes / corrigées à la main sont préservées).
#   - MANUEL : onglet "Actions" → "Générer les traductions (i18n)" → Run
#     (permet de choisir les langues et de forcer une re-traduction complète).
#
# PRÉREQUIS (une fois) : un secret `I18N_TOKEN` dans ce repo
#   (Settings → Secrets and variables → Actions → New repository secret) =
#   un fine-grained PAT avec "Contents: Read and write" sur le repo eventez-i18n.

on:
  # AUTO : un push qui change en.json → on ne (re)traduit QUE la vague 1
  # (langues prioritaires) en --only-missing. Les vagues suivantes se lancent
  # manuellement pour ne pas exploser le temps CI (Argos = ~100 Mo/langue).
  push:
    branches: [master]
    paths:
      - 'src/i18n/locales/en.json'
  workflow_dispatch:
    inputs:
      wave:
        description: 'Numéro de vague de priorité à traduire (1..6). Cf. scripts/i18n_priority.py'
        required: false
        default: '1'
      langs:
        description: 'OU langues précises (ex: es,pt,de). Prioritaire sur "wave" si renseigné.'
        required: false
        default: ''
      only_missing:
        description: 'Ne traduire que les clés manquantes (préserve les corrections humaines)'
        type: boolean
        default: true

jobs:
  generate:
    runs-on: ubuntu-latest
    # Garde-fou : une vague de ~10 langues Argos tient largement en 2h. Au-delà,
    # c'est qu'un modèle boucle → on coupe plutôt que de brûler des minutes CI.
    timeout-minutes: 120
    steps:
      - name: Checkout (repo mobile — source en.json + script)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache des modèles Argos/Stanza entre les runs → re-téléchargement évité.
      - name: Cache des modèles
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/stanza_resources
          key: argos-models-${{ github.run_id }}
          restore-keys: |
            argos-models-

      - name: Installer Argos Translate
        run: pip install argostranslate

      - name: Checkout du repo de traductions (destination)
        uses: actions/checkout@v4
        with:
          repository: flashcoder237/eventez-i18n
          token: ${{ secrets.I18N_TOKEN }}
          path: i18n-out

      - name: Générer les traductions
        run: |
          set -e
          # Sélection des cibles :
          #  - langs explicites (manuel) → --langs
          #  - sinon wave (manuel ou défaut 1) → --wave N
          #  - push auto (pas d'input) → vague 1
          LANGS="${{ github.event.inputs.langs }}"
          WAVE="${{ github.event.inputs.wave }}"
          ONLY="${{ github.event.inputs.only_missing }}"

          if [ -n "$LANGS" ]; then
            SELECT="--langs $LANGS"
          else
            # Défaut robuste : vague 1 si non fournie (push auto).
            SELECT="--wave ${WAVE:-1}"
          fi
          # only_missing par défaut true (préserve les corrections humaines).
          if [ "$ONLY" != "false" ]; then
            SELECT="$SELECT --only-missing"
          fi

          echo "python scripts/translate_locales.py $SELECT --out i18n-out"
          python scripts/translate_locales.py $SELECT --out i18n-out

      - name: Commit + push vers eventez-i18n
        working-directory: i18n-out
        run: |
          git config user.name "eventez-i18n-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "i18n: génération auto (${{ github.event_name }})"
          git push
